# Coturn TURN Server Configuration
# KALEN — NAT Traversal for WebRTC
#
# Docs: https://github.com/coturn/coturn/wiki/turnserver
#
# ⚠️  For production, use long-term credentials with a shared
#     secret and generate time-limited passwords. Do NOT use
#     static credentials in production.

# ── Network ────────────────────────────────────────────────────

# TURN realm — must match your domain in production
realm=kalen.local

# Listening port for TURN/STUN (UDP and TCP)
listening-port=3478

# TLS listening port for TURNS (TURN over TLS)
tls-listening-port=5349

# Alt listening port (some clients prefer 443)
# alt-listening-port=443

# Relay port range for media streams
min-port=49152
max-port=65535

# ── Authentication ─────────────────────────────────────────────

# Use long-term credential mechanism
lt-cred-mech

# Static credentials for local development
# ⚠️  Replace with use-auth-secret in production
user=${TURN_USERNAME:-kalen}:${TURN_PASSWORD:-kalen_dev}

# For production, use TURN shared secret instead of static users:
# use-auth-secret
# static-auth-secret=${TURN_SECRET}

# ── TLS / DTLS ────────────────────────────────────────────────

# Enable TLS (required for TURNS)
# ⚠️  Provide valid certificates in production
# cert=/etc/ssl/certs/kalen.pem
# pkey=/etc/ssl/private/kalen.key

# Enable DTLS (UDP variant of TLS)
# no-dtls

# ── Functionality ──────────────────────────────────────────────

# Enable fingerprint in TURN messages
fingerprint

# Enable mobility ICE support (important for mobile clients)
mobility

# Disable CLI — not needed in containerized environments
no-cli

# Disable multicast listeners
no-multicast-peers

# Log verbosity
# Options: 0 (none) to 3 (verbose)
verbose

# ── Security ───────────────────────────────────────────────────

# Deny peer IP ranges that should never be relayed
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Allow the Docker bridge network for local dev
allowed-peer-ip=172.16.0.0-172.31.255.255

# Maximum session lifetime (24 hours)
max-session-lifetime=86400000

# Channel lifetime (10 minutes)
channel-lifetime=600000

# Permission lifetime (5 minutes)
permission-lifetime=300000

# ── Threading ──────────────────────────────────────────────────

# Number of relay threads (0 = auto, based on CPU cores)
relay-threads=0

# ── Logging ────────────────────────────────────────────────────

# Log to stdout (works well with Docker)
log-file=stdout
