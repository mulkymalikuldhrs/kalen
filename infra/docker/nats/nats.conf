# NATS Server Configuration
# KALEN — Event Bus with JetStream
#
# Docs: https://docs.nats.io/running-a-nats-service/configuration
#
# This configuration enables JetStream for persistent messaging
# with reasonable limits for local development and small
# production deployments.

# ── Server ─────────────────────────────────────────────────────

# Server name (useful in clustered deployments)
server_name: kalen-nats

# Listen for client connections
listen: 0.0.0.0:4222

# HTTP monitoring endpoint
http_port: 8222

# ── JetStream ─────────────────────────────────────────────────

# Enable JetStream for persistent streaming
jetstream {
  # Directory for JetStream data storage
  store_dir: "/data"

  # Maximum memory the JetStream store can use (256 MB)
  # This is in-memory caching for active streams
  max_memory_store: 256MB

  # Maximum disk space the JetStream file store can use (1 GB)
  # This is the persistent storage limit for stream data
  max_file_store: 1GB
}

# ── Logging ────────────────────────────────────────────────────

# Log to stdout (Docker-friendly)
log_file: stdout

# Log level: debug | info | warn | error | trace
log_level: info

# Include timestamps in log output
log_time: true

# ── Limits ────────────────────────────────────────────────────

# Maximum number of connections
max_connections: 4096

# Maximum number of subscriptions per connection
max_subscriptions: 0

# Maximum payload size (1 MB)
max_payload: 1MB

# Maximum control line size (4 KB)
max_control_line: 4KB

# Ping interval (seconds)
ping_interval: 120

# Maximum outstanding pings before disconnect
ping_max: 3

# ── TLS (Production) ──────────────────────────────────────────
# Uncomment and configure for production deployments:
# tls {
#   cert_file: "/etc/ssl/certs/nats.pem"
#   key_file: "/etc/ssl/private/nats.key"
#   ca_file: "/etc/ssl/certs/ca.pem"
#   verify: true
# }

