# Redis Configuration
# KALEN — Session Cache, Rate Limiting, Challenge Store
#
# Docs: https://redis.io/docs/latest/operate/oss_and_stack/management/config/
#
# This configuration is optimized for a cache + session store
# workload. Redis is NOT used as a primary data store — all
# persistent data lives in PostgreSQL.

# ── Authentication ─────────────────────────────────────────────

# Require password for all connections
# ⚠️  Use a strong password in production: openssl rand -base64 32
requirepass kalen_dev

# ── Memory ─────────────────────────────────────────────────────

# Maximum memory usage — Redis will evict keys when this limit is reached
maxmemory 256mb

# Eviction policy: evict least recently used keys across all namespaces
# This is appropriate for a cache workload where some data loss is acceptable
maxmemory-policy allkeys-lru

# ── Persistence ────────────────────────────────────────────────

# Enable AOF (Append Only File) persistence for better durability
appendonly yes

# AOF sync policy: everysec balances performance and durability
# - always: safest, but slowest (sync on every write)
# - everysec: sync once per second (recommended)
# - no: let OS handle syncing (fastest, potential data loss)
appendfsync everysec

# Auto-rewrite AOF when it grows too large
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a secondary backup
save 900 1
save 300 10
save 60 10000

# RDB file name
dbfilename dump.rdb

# ── Networking ─────────────────────────────────────────────────

# Listen on all interfaces (Docker will handle port mapping)
bind 0.0.0.0

# Default Redis port
port 6379

# TCP keepalive (seconds) — helps detect dead connections
tcp-keepalive 300

# Maximum number of concurrent clients
maxclients 10000

# Timeout for idle connections (0 = no timeout)
timeout 300

# ── General ────────────────────────────────────────────────────

# Run as a daemon (no — we run in the foreground for Docker)
daemonize no

# Log level: debug | verbose | notice | warning
loglevel notice

# Number of databases
databases 16

# ── Slow Log ───────────────────────────────────────────────────

# Log queries slower than 10ms
slowlog-log-slower-than 10000

# Keep the last 128 slow queries in memory
slowlog-max-len 128

# ── Lazy Freeing ──────────────────────────────────────────────

# Use background threads for memory release on del/unlink/flush
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ── Security ───────────────────────────────────────────────────

# Rename dangerous commands (optional, for defense-in-depth)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ── TLS (Production) ──────────────────────────────────────────
# Uncomment and configure for production deployments:
# tls-port 6380
# tls-cert-file /etc/ssl/certs/redis.pem
# tls-key-file /etc/ssl/private/redis.key
# tls-ca-cert-file /etc/ssl/certs/ca.pem
# tls-auth-clients optional
