# KALEN Prometheus Scrape Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "kalen-server"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: /metrics

  - job_name: "livekit"
    static_configs:
      - targets: ["livekit:7880"]

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
